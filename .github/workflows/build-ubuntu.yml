name: Build Ubuntu
on:
  push:
    tags: ["v*"]

  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install

      - name: Build
        run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: llama-manager-ubuntu
          path: dist